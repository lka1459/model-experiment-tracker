    <main>
    <header>
    <h1>Model Experiment Tracker</h1>
    <hr>
    </header>

        <section id="form">
            <form>
                <div id="title_block">
                <h2 id="form_title">Form</h2>
                <hr>
                </div>

                <label for="pname">Project Name:</label>
                <input type="text" class="form_item" id="pname" name="pname">

                <label for="mname">Model Name:</label>
                <input type="text" class="form_item" id="mname" name="mname">

                <label for="acc">Accuracy:</label>
                <input type="number" step="0.0001" class="form_item" id="acc" name="acc">

                <label for="prec">Precision:</label>
                <input type="number" step="0.0001" class="form_item" id="prec" name="prec">

                <label for="recall">Recall:</label>
                <input type="number" step="0.0001" class="form_item" id="recall" name="recall">

                <label for="f1">F1 Score:</label>
                <input type="number" step="0.0001" class="form_item" id="f1" name="f1">

                <label for="notes">Notes:</label>
                <textarea type="text" class="form_item" id="notes" name="notes" placeholder="Additional Notes..."></textarea>

                <button type="submit">Submit Form</button>
            </form>
        </section>

    <section class="container">
        <div class="block">
            <p class="block_text">Higher</p>

        </div>

        <div class="block">
            <p class="block_text"> Lower</p>
