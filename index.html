<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Home</title>

    <script src="dist/main.js" defer></script>

</head>

<body>
    <nav>
        <ul>
            <li><p>Model Experiment Tracker</p></li>
            <li class="right">
                <button class="btn-close-form" onclick="togglePopup()"><p>Create new entry</p></button>
            </li>
            
        </ul>

    </nav>

    <main>
    <header>
    <h1>Experiment Results</h1>
    <hr>
    </header>

    <section id="form_section">
            <form id="popupOverlay">
                <button id="close_btn" onclick="togglePopup()">X</button>
                <div id="title_block">
                <h2 id="form_title">Form</h2>
                <hr>
                </div>

                <label for="pname">Project Name:</label>
                <input type="text" class="form_item" id="pname" name="pname">

                <label for="mname">Model Name:</label>
                <input type="text" class="form_item" id="mname" name="mname">

                <label for="accr">Accuracy:</label>
                <input type="number" step="0.0001" class="form_item" id="accr" name="acc">

                <label for="prec">Precision:</label>
                <input type="number" step="0.0001" class="form_item" id="prec" name="prec">

                <label for="recall">Recall:</label>
                <input type="number" step="0.0001" class="form_item" id="recall" name="recall">

                <label for="f1">F1 Score:</label>
                <input type="number" step="0.0001" class="form_item" id="f1" name="f1">

                <label for="notes">Notes:</label>
                <textarea type="text" class="form_item" id="notes" name="notes" placeholder="Additional Notes..."></textarea>

                <button id="submit_btn" type="submit">Submit Form</button>
            </form>
        </section>

    <section class="container">

        <div class="block">
            <p class="block_text">Higher</p>

        </div>

        <div class="block">
            <p class="block_text"> Lower</p>

        </div>

        <div class="block">
            <p class="block_text">Lower</p>

        </div>

        <div class="block">
            <p class="block_text">Lower</p>

        </div>

    </section>
    </main>
</body>

</html>
